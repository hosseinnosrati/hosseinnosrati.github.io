<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#bgRf)"/>
  <!-- Concentric RF Wave Circles -->
  <g stroke="#3b82f6" fill="none" opacity="0.3" stroke-width="1.5">
    <circle cx="90" cy="120" r="30"/>
    <circle cx="90" cy="120" r="60"/>
    <circle cx="90" cy="120" r="90"/>
    <circle cx="90" cy="120" r="120"/>
    <circle cx="90" cy="120" r="150"/>
  </g>
  <!-- Chest Vibration & Micro-Doppler Trace -->
  <path d="M 170 120 Q 200 80 230 120 T 290 120 T 350 120 T 390 120" fill="none" stroke="url(#rfGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Apex Beat Micro Spikes -->
  <path d="M 230 120 L 235 105 L 240 135 L 245 120" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 290 120 L 295 105 L 300 135 L 305 120" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 350 120 L 355 105 L 360 135 L 365 120" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Badges -->
  <rect x="25" y="20" width="145" height="24" rx="4" fill="#0284c7" opacity="0.9"/>
  <text x="97" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">5.8 GHz Wi-Fi CSI</text>
  <rect x="245" y="195" width="130" height="24" rx="4" fill="#047857" opacity="0.9"/>
  <text x="310" y="211" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">0.3 mm Apex Beat</text>
</svg>
