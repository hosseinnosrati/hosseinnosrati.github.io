<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="csGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="url(#bgCs)"/>
  <!-- Matrix / Sub-Nyquist Grid -->
  <g fill="#10b981" opacity="0.3">
    <rect x="35" y="75" width="20" height="20" rx="3"/>
    <rect x="65" y="75" width="20" height="20" rx="3" opacity="0.1"/>
    <rect x="95" y="75" width="20" height="20" rx="3"/>
    <rect x="35" y="105" width="20" height="20" rx="3" opacity="0.1"/>
    <rect x="65" y="105" width="20" height="20" rx="3"/>
    <rect x="95" y="105" width="20" height="20" rx="3" opacity="0.1"/>
    <rect x="35" y="135" width="20" height="20" rx="3"/>
    <rect x="65" y="135" width="20" height="20" rx="3"/>
    <rect x="95" y="135" width="20" height="20" rx="3"/>
  </g>
  <!-- OMP Sparse Vector Arrow & Reconstruction Wave -->
  <path d="M 140 120 L 175 120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 190 120 L 220 120 L 235 60 L 250 180 L 265 120 L 300 120 Q 320 90 340 120 L 380 120" fill="none" stroke="url(#csGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Badges -->
  <rect x="25" y="20" width="155" height="24" rx="4" fill="#047857" opacity="0.9"/>
  <text x="102" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sub-Nyquist CS (OMP)</text>
  <rect x="245" y="195" width="130" height="24" rx="4" fill="#0369a1" opacity="0.9"/>
  <text x="310" y="211" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">52.3 dB SNR (0.24% PRD)</text>
</svg>
